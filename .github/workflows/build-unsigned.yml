name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "using $newest"
          echo "DEVELOPER_DIR=$newest" >> "$GITHUB_ENV"

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - uses: ./.github/actions/clone-everything

      - name: Check rebrand
        run: python3 tools/rebrand.py --check

      - name: Build
        run: |
          xcodebuild \
            -workspace Signal.xcworkspace \
            -scheme Signal \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO

      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/Signal.app ipa/Payload/
          (cd ipa && zip -qry ../Wren-unsigned.ipa Payload)
          shasum -a 256 Wren-unsigned.ipa | tee Wren-unsigned.ipa.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: Wren-unsigned
          path: |
            Wren-unsigned.ipa
            Wren-unsigned.ipa.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: Wren-unsigned

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" Wren-unsigned.ipa Wren-unsigned.ipa.sha256 \
            --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" \
            --notes "Unsigned IPA. Sign it yourself with AltStore or Sideloadly. SHA-256 is in the .sha256 file."
